<!DOCTYPE html>
<html>
<head>
<title>Виртуальный тур</title>
<meta charset="utf-8">
<meta name="viewport" content="target-densitydpi=device-dpi, width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, minimal-ui" />
<style> @-ms-viewport { width: device-width; } </style>
<link rel="stylesheet" href="vendor/reset.min.css">
<link rel="stylesheet" href="style.css?v=4">
<link rel="stylesheet" href="admin.css?v=4">
</head>
<body>

<div id="pano"></div>

<div id="sceneList">
  <ul class="scenes">
    <a href="javascript:void(0)" class="scene" data-id="0----------1">
      <li class="text">Центр (экспозиция)</li>
    </a>
    <a href="javascript:void(0)" class="scene" data-id="1--1----">
      <li class="text">Диагональ 1</li>
    </a>
    <a href="javascript:void(0)" class="scene" data-id="2--1-----1">
      <li class="text">Экватор 1</li>
    </a>
    <a href="javascript:void(0)" class="scene" data-id="3--2---">
      <li class="text">Диагональ 2</li>
    </a>
    <a href="javascript:void(0)" class="scene" data-id="4--3------">
      <li class="text">Диагональ 3</li>
    </a>
    <a href="javascript:void(0)" class="scene" data-id="5--2-----">
      <li class="text">Экватор 2</li>
    </a>
    <a href="javascript:void(0)" class="scene" data-id="6--4------1">
      <li class="text">Диагональ 4</li>
    </a>
  </ul>
</div>

<div id="titleBar">
  <h1 class="sceneName"></h1>
</div>

<!-- Autorotate toggle: pure CSS icons -->
<a href="javascript:void(0)" id="autorotateToggle" class="vintage-btn">
  <span class="icon-off"><i class="icon-play"></i></span>
  <span class="icon-on"><i class="icon-pause"></i></span>
</a>

<!-- Fullscreen toggle: pure CSS icons -->
<a href="javascript:void(0)" id="fullscreenToggle" class="vintage-btn">
  <span class="icon-off">
    <i class="icon-fullscreen">
      <span class="corner-tr"></span>
      <span class="corner-bl"></span>
    </i>
  </span>
  <span class="icon-on">
    <i class="icon-windowed">
      <span class="corner-tr"></span>
      <span class="corner-bl"></span>
    </i>
  </span>
</a>

<!-- Scene list toggle: pure CSS icons -->
<a href="javascript:void(0)" id="sceneListToggle" class="vintage-btn">
  <span class="icon-off">
    <i class="icon-expand">
      <span></span><span></span><span></span>
    </i>
  </span>
  <span class="icon-on"><i class="icon-collapse"></i></span>
</a>

<!-- View control buttons: pure CSS icons -->
<a href="javascript:void(0)" id="viewUp" class="viewControlButton viewControlButton-1 vintage-btn">
  <i class="icon-up"></i>
</a>
<a href="javascript:void(0)" id="viewDown" class="viewControlButton viewControlButton-2 vintage-btn">
  <i class="icon-down"></i>
</a>
<a href="javascript:void(0)" id="viewLeft" class="viewControlButton viewControlButton-3 vintage-btn">
  <i class="icon-left"></i>
</a>
<a href="javascript:void(0)" id="viewRight" class="viewControlButton viewControlButton-4 vintage-btn">
  <i class="icon-right"></i>
</a>
<a href="javascript:void(0)" id="viewIn" class="viewControlButton viewControlButton-5 vintage-btn">
  <i class="icon-plus"></i>
</a>
<a href="javascript:void(0)" id="viewOut" class="viewControlButton viewControlButton-6 vintage-btn">
  <i class="icon-minus"></i>
</a>

<script src="vendor/screenfull.min.js"></script>
<script src="vendor/bowser.min.js"></script>
<script src="vendor/marzipano.js"></script>

<script src="data.js?v=4"></script>
<script src="index.js?v=4"></script>
<script src="admin.js?v=4"></script>

</body>
</html>
